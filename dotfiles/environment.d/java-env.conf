# Java 17（与 ~/.local/bin 里的 java/javac 等 wrapper 同一套 JDK）。
# 系统自带 JDK 27：env JAVA_HOME=/usr/lib/jvm/default <命令>
# 注意：systemd 会忽略 environment.d 里的 PATH（实测 show-environment 不变），
# 所以这里只设 JAVA_HOME。systemd 直接拉起的进程里 `java` 可能仍是系统版本，
# 但 Gradle/Maven 读 JAVA_HOME，不受影响。详见 README「已知限制」。
JAVA_HOME=${HOME}/opt/jdk/jdk-17.0.21+9
