[general]
import = ["~/.config/alacritty/themes/dragon-mist.toml"]

[font]
size = 11.0

[font.normal]
family = "CaskaydiaCove Nerd Font Mono"
style = "Regular"

# 粗体只用字重，不提亮颜色，保住低对比
[colors]
draw_bold_text_with_bright_colors = false

[cursor]
style = { shape = "Beam", blinking = "Never" }

[window]
opacity = 0.92
padding = { x = 14, y = 14 }
dynamic_padding = true

[mouse]
hide_when_typing = true

# 打开 alacritty 即进入 tmux 会话 Xendr1a（有则 attach，无则新建）
# 之所以放在这里而不是 .zshrc：powerlevel10k 的 instant prompt 会接管 stdin，
# 在 .zshrc 里调 tmux 会报 "open terminal failed: not a terminal"。
[terminal.shell]
program = "/usr/bin/tmux"
args = ["new-session", "-A", "-s", "Xendr1a"]
