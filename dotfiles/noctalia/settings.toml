[notification]
border = false

[osd.kinds]
keyboard_layout = false

[plugins]
auto_update = "all"
enabled = [ "xendr1a/lyrics", "xendr1a/niri-displays" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/user/.local/share/noctalia/plugins"
    name = "dev"

[shell]
avatar_path = "/home/user/Pictures/avatar.png"
button_borders = false
card_borders = false
external_ip_enabled = true
input_borders = false
launch_apps_as_systemd_services = true
panel_anchor_bar = "default"
password_style = "random"
popup_borders = false
screen_time_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    app_grid = true
    categories = false
    show_app_origin_indicator = false

    [shell.panel]
    open_near_click_control_center = true
    transparency_mode = "soft"

    [shell.screenshot]
    directory = "/home/user/Pictures"
    remember_last_region = true
    show_cursor = true

    [shell.shadow]
    direction = "center"

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Ayu"
community_palette = "GitHub Dark"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [
        "btop",
        "cava",
        "gtk3",
        "gtk4",
        "ghostty",
        "hyprland",
        "kcolorscheme",
        "labwc",
        "mango",
        "niri",
        "qt",
        "umbriel"
    ]

[wallpaper]
directory = "/home/user/Pictures/wallhaven"
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 600

    [wallpaper.default]
    path = "/home/user/Pictures/wallhaven/wallpaper.jpg"

    [wallpaper.last]
    path = "/home/user/Pictures/wallhaven/wallpaper.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/user/Pictures/wallhaven/wallpaper-2.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/user/Pictures/wallhaven/wallpaper.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/user/Pictures/wallhaven/wallpaper.jpg"

[widget.battery]
display_mode = "graphic"

[widget.brightness]
show_label = false

[widget.screen-solo]
glyph = "device-desktop"
tooltip = "只留当前显示器 / 全部打开（右键：全部打开）"
type = "custom_button"

    [widget.screen-solo.actions]
    left = "exec /home/user/.local/bin/solo-display"
    right = "exec /home/user/.local/bin/solo-display all"

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget."xendr1a/niri-displays:bar".actions]
right = "panel-toggle control-center monitor"
scroll_down = "brightness-down"
scroll_up = "brightness-up"